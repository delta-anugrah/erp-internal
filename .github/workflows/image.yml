# A version tag builds the erp-internal image, checks it and pushes it to GHCR. Nothing else: the server pulls the
# tag by hand (deploy/server/README.md), so no server key is stored here. Never a `latest` tag: what runs is always
# an exact tag. Adapted from bpt's .github/workflows/image.yml.
name: Build erp-internal image

on:
  push:
    tags:
      - "v*.*.*"

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate the tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid tag: $GITHUB_REF_NAME"; exit 1; }
          # The version people see on the login page and in Settings is erp_internal.__version__: bump it first.
          versi=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' erp_internal/__init__.py)
          [ "v$versi" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, erp_internal.__version__ $versi"; exit 1; }

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build (linux/amd64, like the server)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Containerfile
          platforms: linux/amd64
          build-args: ERP_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          load: true
          push: false

      - name: Check the image against versi.json
        run: deploy/check_image.sh "$IMAGE:$GITHUB_REF_NAME"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: docker push "$IMAGE:$GITHUB_REF_NAME"
